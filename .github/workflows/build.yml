name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, test OTLP parity and package both runtimes
        run: ./mvnw -B -ntp clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            java-libraries/**/target/surefire-reports/
            dotnet-libraries/target/test-results/
